<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#15d677" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#15d677" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- Squirqle Premium Background -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#bg)" />
  <rect x="8" y="8" width="104" height="104" rx="28" fill="none" stroke="#27272a" stroke-width="1.5" />

  <!-- The Chart/S shape with glow -->
  <g filter="url(#glow)">
    <path d="M 76 38 
             C 76 18, 44 18, 44 48 
             C 44 60, 76 60, 76 72 
             C 76 102, 44 102, 44 82" 
          fill="none" 
          stroke="url(#neon)" 
          stroke-width="14" 
          stroke-linecap="round" />
          
    <!-- Nodes -->
    <circle cx="76" cy="38" r="7" fill="#a7f3d0" />
    <circle cx="44" cy="82" r="7" fill="#059669" />
  </g>
</svg>